"1.3":["Kernbegrippen: waarden en normen, belangen, macht, (T) sociale ongelijkheid.","Waarde: principe dat mensen belangrijk vinden en willen nastreven (meestal één woord, bv. vrijheid).","Norm: regel over hoe jij en anderen zich moeten gedragen. Hoort altijd bij een waarde.","Belang: het voordeel dat je ergens bij hebt.","Belangentegenstelling: het belang van de een botst met het belang van een ander.","Macht: de mogelijkheid om het gedrag van anderen te beïnvloeden.","Machtsmiddelen: functie/beroep, kennis en vaardigheden, aanzien/status, overtuigingskracht, geld, aantal mensen, toegang tot media, toegang tot invloedrijke personen, geweld.","Sociale ongelijkheid (T): macht, kennis en geld zijn niet gelijk verdeeld."],
"3.1":["Politiek: keuzes maken en beslissingen nemen over hoe een land, provincie of gemeente bestuurd wordt.","Ambtenaren werken voor de overheid. Overheid = alle ambtenaren en politici samen.","Politiek bemoeit zich met zaken van algemeen belang (voor veel mensen belangrijk).","De overheid betaalt via belastingen. Te weinig geld? Bezuinigen, geld lenen of belasting verhogen.","Democratie: démos (volk) + kratein (regeren): het volk heeft invloed op besluiten.","Directe democratie: volk stemt zelf (referendum). Indirecte democratie: volk kiest volksvertegenwoordigers."],
"3.2":["Actief kiesrecht: recht om te stemmen. Passief kiesrecht: recht om je verkiesbaar te stellen. Beide vanaf 18 jaar.","Verkiezingen zijn vrij en geheim.","Lijsttrekker: belangrijkste persoon van een partij in verkiezingstijd; gezicht van de partij.","Linkse partijen: actieve overheid, opkomen voor kwetsbaren, eerlijke verdeling inkomen, gelijke kansen, milieu.","Rechtse partijen: meer vrijheid, passieve overheid, lage belastingen, eigen verantwoordelijkheid, veiligheid (zwaardere straffen).","Middenpartijen: zowel linkse als rechtse standpunten.","Na verkiezingen moeten partijen samenwerken en compromissen sluiten."],
"3.3":["Politieke stroming: verzameling ideeën over wat belangrijk is en hoe mensen samenleven. Drie grote: liberalisme, sociaaldemocratie, christendemocratie.","Liberalisme: vrijheid (persoonlijk én economisch: minder regels, lagere belastingen).","Sociaaldemocratie: solidariteit en gelijkwaardigheid; minder verschil rijk-arm; sociale grondrechten (zorg, onderwijs, huisvesting).","Christendemocratie: christelijk geloof, naastenliefde, rol voor (vrijwilligers)organisaties, zorg voor de schepping.","Populistische partijen: zeggen als enige de ‘wil van het volk’ te kennen.","One-issue-partijen: één onderwerp centraal (Partij voor de Dieren, 50PLUS, BBB)."],
"3.4":["Regeerakkoord: de plannen van de regering. Grootste partij zoekt partners; samen een meerderheid.","Regering = koning + ministers. Kabinet = ministers + staatssecretarissen (dagelijks bestuur).","Staatssecretaris: soort assistent-minister voor een deel van de taken.","Minister-president (premier): leider van het kabinet, voorzitter ministerraad.","Ministers maken wetsvoorstellen; wet pas aangenomen met Tweede én Eerste Kamer.","Koning (staatshoofd): handtekening onder wetten, troonrede, overleg met minister-president, vertegenwoordigen in buitenland, ministers beëdigen.","Prinsjesdag (3e dinsdag september): troonrede en miljoenennota (Rijksbegroting)."],
"3.5":["Tweede Kamer: 150 leden, direct gekozen. Eerste Kamer: 75 leden, indirect gekozen (via provincies). Samen: parlement.","Twee hoofdtaken: (mede)wetgeving en controleren van het kabinet.","Wetgeving: ministers én Kamerleden maken voorstellen; TK debatteert en keurt goed; EK doet laatste check en kan niet meer veranderen.","Recht van amendement (veranderen), initiatief (zelf indienen).","Controle: vragen stellen, motie, motie van wantrouwen, interpellatie, enquêterecht.","Coalitie: partijen die regeren. Oppositie: partijen die niet regeren. Meerderheid TK: 76 zetels."],

function quiz(){S.q=sh(wshuf(MC,x=>"q:"+x[0]).slice(0,10));S.i=0;S.s=0;qr()}
function qr(){const i=S.i;if(i>=S.q.length){const h=load("ml-best");const b=Math.max(h.b||0,S.s);save("ml-best",{b});m.innerHTML=`<div class="c"><h2>Score: ${S.s}/${S.q.length}</h2><p class="mu">Beste score: ${b}/${S.q.length}</p><button class="btn p" onclick="quiz()">Nieuwe quiz</button></div>`;return}
const q=S.q[i];S.o=sh(q[1].map((t,j)=>[t,j]));S.a=false;m.innerHTML=`<div class="mu">Vraag ${i+1}/${S.q.length}</div><div class="bar"><i style="width:${i/S.q.length*100}%"></i></div><div class="c"><h2>${q[0]}</h2>${S.o.map(([t,j],n)=>`<button class="btn o" id="o${n}" onclick="ka(${n})">${t}</button>`).join("")}<div id="fb"></div></div>`}
function ka(n){if(S.a)return;S.a=true;const q=S.q[S.i],ok=S.o[n][1]==q[2];if(ok)S.s++;rec("q:"+q[0],ok);S.o.forEach(([t,j],k)=>{if(j==q[2])$("#o"+k).classList.add("ok")});if(!ok)$("#o"+n).classList.add("no");$("#fb").innerHTML=`<p>${ok?"✅ Goed!":"❌ Niet goed."} ${q[3]}</p><button class="btn p" onclick="S.i++;qr()">Volgende</button>`}
function oef(){S.q=OPEN.map((x,i)=>i);S.i=0;S.r={};or()}
function or(){const i=S.i,tot=OPEN.length;if(i>=tot){const g=Object.values(S.r).filter(v=>v==2).length,b=Object.values(S.r).filter(v=>v==1).length;m.innerHTML=`<div class="c"><h2>Resultaat</h2><p>Goed: ${g} · Bijna: ${b} · Nog oefenen: ${tot-g-b}</p><button class="btn p" onclick="oef()">Opnieuw</button></div>`;return}
const q=OPEN[i];m.innerHTML=`<div class="mu">Opgave ${i+1}/${tot} · schrijf eerst je eigen antwoord</div><div class="bar"><i style="width:${i/tot*100}%"></i></div><div class="c"><h2>${q[0]}</h2><textarea id="ta" rows="4" placeholder="Typ je antwoord..."></textarea><p><button class="btn p" onclick="this.parentNode.nextElementSibling.hidden=false;this.hidden=true">Toon modelantwoord</button></p><div hidden><div class="ans">${q[1]}</div><p>Hoe ging het?</p><div class="row"><button class="btn" onclick="rate(0)">Nog niet</button><button class="btn" onclick="rate(1)">Bijna</button><button class="btn p" onclick="rate(2)">Goed</button></div></div></div>`}
function vg(){const a=ST(),st=id=>{const x=a[id];return!x?0:x.l?2:1};
const lab=["⚪ nog niet geoefend","🟠 Fout","🟢 Goed"];
const fl=FC.map(c=>[c,st("f:"+c[0])]),g=fl.filter(x=>x[1]==2).length,ch=fl.filter(x=>x[1]==1).length;
const qs=MC.map(q=>[q,a["q:"+q[0]]]).filter(x=>x[1]);
const row=(t,x)=>`<li>${t} <span class="mu">${x}</span></li>`;
m.innerHTML=`<div class="c"><h2>Begrippen (flashcards)</h2><div class="bar"><i style="width:${g/FC.length*100}%"></i></div><p>🟢 Goed: ${g} · 🟠 Fout: ${ch} · ⚪ Nog niet geoefend: ${FC.length-g-ch} (van ${FC.length})</p>
<p class="mu">Status = je laatste antwoord. Begrippen met Fout komen vaker terug.</p>
<ul>${[...fl].sort((p,q)=>p[1]-q[1]||0).map(([c,v])=>row("<b>"+c[0]+"</b>",lab[v]+(a["f:"+c[0]]?` (${a["f:"+c[0]].r}× goed, ${a["f:"+c[0]].w}× fout)`:""))).join("")}</ul></div>
<div class="c"><h2>Quizvragen</h2><p>${qs.length?"Je hebt "+qs.length+" van "+MC.length+" vragen geoefend.":"Nog geen quizvragen gemaakt."}</p>
<ul>${qs.sort((p,q)=>(q[1].w-q[1].r)-(p[1].w-p[1].r)).map(([q,x])=>row(q[0],`✅ ${x.r}× · ❌ ${x.w}×`)).join("")}</ul></div>
<button class="btn" onclick="if(confirm('Alle voortgang wissen?')){save('ml-st',{});vg()}">Voortgang wissen</button>`}
function rate(v){S.r[S.i]=v;S.i++;or()}
go("leer");
</script></body></html>
